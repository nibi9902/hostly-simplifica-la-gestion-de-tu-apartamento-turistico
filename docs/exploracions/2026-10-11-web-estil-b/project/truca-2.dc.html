<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Te llamo · una línia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#fff}
.pg{container-type:inline-size;container-name:pagina}
.pg *{box-sizing:border-box}
.pg p,.pg h2{margin:0;padding:0}
.cont{width:100%;max-width:1440px;margin:0 auto;padding-inline:64px}
.pill{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border-radius:9999px;border:0;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer}
.pill-pri{background:#2563EB;color:#fff}
.truca{height:400px;display:flex;align-items:center;background:#fff;border-top:1px solid hsl(220 10% 92%)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:64px;align-items:center}
.grid h2{font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-0.03em;text-wrap:balance}
.grid h2 span{color:hsl(220 8% 52%)}
.grid small{display:block;font-size:14px;color:hsl(220 8% 42%);margin-top:12px}
.camp{display:flex;align-items:center;gap:14px;border-bottom:2px solid hsl(220 14% 9%);padding-bottom:10px}
.camp .prefix{font-size:22px;font-weight:600;color:hsl(220 8% 42%)}
.camp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 24px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;color:hsl(220 14% 9%)}
.nota{font-size:13px;color:hsl(220 8% 42%);margin-top:10px}
@container pagina (max-width: 900px){
  .cont{padding-inline:20px}
  .truca{height:auto;padding:48px 0}
  .grid{grid-template-columns:minmax(0,1fr);gap:28px}
  .grid h2{font-size:28px}
}
</style>
</helmet>
<div class="pg" style="width: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: hsl(220 14% 9%); background: #fff; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11' 1">
  <section class="truca">
    <div class="cont grid">
      <div><h2>¿Prefieres hablarlo? <span>Déjame tu teléfono y te llamo yo.</span></h2><small>Biel Alsina, fundador de Hostly</small></div>
      <div>
        <div class="camp"><span class="prefix">+34</span><input type="tel" inputmode="tel" placeholder="Tu teléfono" aria-label="Tu teléfono" autocomplete="tel"><button class="pill pill-pri" type="button">Llámame</button></div>
        <p class="nota">Solo para hablar de tus pisos.</p>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
