<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Te llamo · targeta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:hsl(210 20% 98%)}
.pg{container-type:inline-size;container-name:pagina}
.pg *{box-sizing:border-box}
.pg p,.pg h2{margin:0;padding:0}
.cont{width:100%;max-width:1440px;margin:0 auto;padding-inline:64px}
.pill{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:9999px;border:0;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer}
.pill-pri{background:#2563EB;color:#fff}
.truca{height:400px;display:flex;align-items:center;background:hsl(210 20% 98%)}
.targ{max-width:1040px;margin:0 auto;width:100%;border-radius:28px;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.06),inset 0 0 0 1px hsl(220 13% 91%);padding:36px 44px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:40px;align-items:center}
.qui{display:flex;gap:18px;align-items:flex-start}
.avatar{width:56px;height:56px;border-radius:9999px;background:hsl(220 14% 11%);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:600;flex-shrink:0}
.qui h2{font-size:32px;line-height:1.1;font-weight:700;letter-spacing:-0.025em}
.qui p{font-size:18px;line-height:1.5;color:hsl(220 14% 30%);margin-top:6px}
.qui small{display:block;font-size:14px;color:hsl(220 9% 46%);margin-top:8px}
.form{display:flex;flex-direction:column;gap:10px}
.camp{display:flex;align-items:center;height:56px;padding:0 6px 0 8px;gap:10px;border-radius:9999px;background:hsl(210 20% 97%);box-shadow:inset 0 0 0 1px hsl(220 13% 88%)}
.prefix{height:40px;padding:0 12px;border-radius:9999px;background:#fff;display:inline-flex;align-items:center;font-size:15px;font-weight:600}
.camp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 17px/1 Inter,ui-sans-serif,system-ui,sans-serif;color:hsl(220 14% 11%)}
.form p{font-size:13px;color:hsl(220 9% 46%);padding-left:16px}
@container pagina (max-width: 900px){
  .cont{padding-inline:20px}
  .truca{height:auto;padding:48px 0}
  .targ{grid-template-columns:minmax(0,1fr);padding:24px}
}
</style>
</helmet>
<div class="pg" style="width: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: hsl(220 14% 11%); background: hsl(210 20% 98%); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11' 1">
  <section class="truca">
    <div class="cont">
      <div class="targ">
        <div class="qui">
          <span class="avatar" aria-hidden="true">B</span>
          <div><h2>¿Prefieres hablarlo?</h2><p>Déjame tu teléfono y te llamo yo.</p><small>Biel Alsina · fundador de Hostly</small></div>
        </div>
        <div class="form">
          <div class="camp"><span class="prefix">+34</span><input type="tel" inputmode="tel" placeholder="Tu teléfono" aria-label="Tu teléfono" autocomplete="tel"><button class="pill pill-pri" type="button">Llámame</button></div>
          <p>Solo para hablar de tus pisos.</p>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
