<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Te llamo · la 2, en una targeta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:hsl(210 20% 98%)}
.pg{container-type:inline-size;container-name:pagina}
.pg *{box-sizing:border-box}
.pg p,.pg h2{margin:0;padding:0}
.cont{width:100%;max-width:1440px;margin:0 auto;padding-inline:64px}
.oculta{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pill{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:9999px;border:0;font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill-pri{background:#2563EB;color:#fff}
.truca{height:400px;display:flex;align-items:center;background:hsl(210 20% 98%)}
.truca .targeta{max-width:1040px;margin:0 auto;width:100%;border-radius:28px;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.06),inset 0 0 0 1px hsl(220 13% 91%);padding:44px 48px;display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:56px;align-items:center}
.truca h2{font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-0.03em;text-wrap:balance}
.truca h2 span{color:hsl(220 8% 52%)}
.truca .signa{display:block;font-size:14px;color:hsl(220 8% 42%);margin-top:12px}
.truca .camp{display:flex;align-items:center;gap:14px;border-bottom:2px solid hsl(220 14% 9%);padding-bottom:10px}
.truca .prefix{font-size:20px;font-weight:600;color:hsl(220 8% 42%)}
.truca .camp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 22px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;color:hsl(220 14% 9%)}
.truca .nota{font-size:13px;color:hsl(220 8% 42%);margin-top:10px}
@container pagina (max-width: 900px){
  .cont{padding-inline:20px}
  .truca{height:auto;padding-block:48px}
  .truca .targeta{grid-template-columns:minmax(0,1fr);gap:28px;padding:24px}
  .truca h2{font-size:28px}
}
</style>
</helmet>
<div class="pg" style="width: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: hsl(220 14% 9%); background: hsl(210 20% 98%); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11' 1">
  <section class="truca">
    <div class="cont">
      <div class="targeta">
        <div>
          <h2>¿Prefieres hablarlo? <span>Déjame tu teléfono y te llamo yo.</span></h2>
          <small class="signa">Biel Alsina, fundador de Hostly</small>
        </div>
        <div>
          <div class="camp"><span class="prefix">+34</span><label class="oculta" for="tel-truca">Tu teléfono</label><input id="tel-truca" type="tel" inputmode="tel" placeholder="Tu teléfono" autocomplete="tel"><button class="pill pill-pri" type="button">Llámame</button></div>
          <p class="nota">Solo para hablar de tus pisos.</p>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
