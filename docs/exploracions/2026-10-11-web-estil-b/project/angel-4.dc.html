<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Àngel · la bombolla que s'obre sola</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#fff}
.pg{container-type:inline-size;container-name:pagina}
.pg *{box-sizing:border-box}
.pg p,.pg h2,.pg h3{margin:0;padding:0}
sc-if{display:contents}
.cont{width:100%;max-width:1440px;margin:0 auto;padding-inline:64px}
.retol{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:hsl(220 9% 46%)}
.ic{width:18px;height:18px;flex-shrink:0}
.angel{position:relative;height:760px;padding-top:86px;background:#fff;overflow:hidden}
.centre{display:flex;flex-direction:column;align-items:center;text-align:center}
.angel q{display:block;max-width:1060px;margin-top:22px;font-size:50px;line-height:1.14;font-weight:600;letter-spacing:-0.03em;quotes:"«" "»";text-wrap:balance}
.qui{display:flex;align-items:flex-start;gap:24px;margin-top:40px;text-align:left}
/* El lloc del vídeo ja té la mida final: quan s'obre, la frase no es mou */
.lloc{position:relative;width:190px;height:338px;flex-shrink:0}
.mini{position:absolute;top:0;right:0;width:190px;height:338px;border-radius:24px;overflow:hidden;border:0;padding:0;cursor:pointer;background:hsl(210 20% 92%);box-shadow:0 0 0 0 #fff,0 0 0 0 #2563EB,0 24px 60px -20px rgba(15,23,42,.35);font-family:inherit;animation:obre-mini .8s cubic-bezier(.25,.46,.45,.94) 1s both}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mini::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(9,12,18,.6),rgba(9,12,18,0) 45%)}
.play-ini{position:absolute;z-index:2;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:9999px;background:hsl(0 0% 100% / .94);color:hsl(220 14% 11%);display:grid;place-items:center;opacity:0;animation:fora .25s ease 1s both}
.play-ini .ic{width:16px;height:16px;margin-left:2px}
.viu{position:absolute;inset:0;z-index:1;opacity:1;animation:entra-viu .4s ease 1.7s both}
.progres{position:absolute;left:12px;right:12px;top:12px;height:3px;border-radius:9999px;background:rgba(255,255,255,.35);overflow:hidden}
.progres i{display:block;width:100%;height:100%;border-radius:9999px;background:#fff;transform:scaleX(.3);transform-origin:0 50%;animation:avanca 24s linear 1.7s infinite both}
.mut{position:absolute;right:10px;top:24px;width:30px;height:30px;border-radius:9999px;background:rgba(9,12,18,.45);color:#fff;display:grid;place-items:center}
.mut .ic{width:15px;height:15px}
.ona{position:absolute;left:14px;bottom:16px;height:22px;display:flex;align-items:flex-end;gap:3px}
.ona i{display:block;width:4px;height:22px;border-radius:9999px;background:#fff;transform:scaleY(.6);transform-origin:50% 100%;animation:parla 1.1s ease-in-out infinite}
.ona i:nth-child(2){animation-delay:-.3s}
.ona i:nth-child(3){animation-delay:-.6s}
.ona i:nth-child(4){animation-delay:-.15s}
.ona i:nth-child(5){animation-delay:-.45s}
.nom{padding-top:6px}
.nom b{display:block;font-size:20px;font-weight:600}
.nom small{display:block;font-size:15px;color:hsl(220 9% 46%);margin-top:2px}
.nom em{display:block;font-style:normal;font-size:14px;font-weight:500;color:#2563EB;margin-top:10px}
.capa{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(9,12,18,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:apareix .25s ease both}
.gran{position:relative;width:360px;aspect-ratio:9/16;max-width:90%;border-radius:32px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:creix .3s cubic-bezier(.25,.46,.45,.94) both}
.gran img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gran .barra{position:absolute;left:16px;right:16px;top:16px;height:3px;border-radius:9999px;background:rgba(255,255,255,.35)}
.gran .barra i{display:block;width:30%;height:100%;border-radius:9999px;background:#fff}
.gran .nom-gran{position:absolute;left:18px;right:18px;bottom:20px;color:#fff;font-size:15px;font-weight:600}
.gran .nom-gran small{display:block;font-size:13px;font-weight:400;opacity:.85}
.tanca{position:absolute;right:28px;top:28px;width:44px;height:44px;border-radius:9999px;border:0;background:#fff;color:hsl(220 14% 11%);display:grid;place-items:center;cursor:pointer}
@keyframes obre-mini{from{width:112px;height:112px;border-radius:56px;box-shadow:0 0 0 3px #fff,0 0 0 6px #2563EB,0 24px 60px -20px rgba(15,23,42,0)}to{width:190px;height:338px;border-radius:24px;box-shadow:0 0 0 0 #fff,0 0 0 0 #2563EB,0 24px 60px -20px rgba(15,23,42,.35)}}
@keyframes fora{from{opacity:1}to{opacity:0}}
@keyframes entra-viu{from{opacity:0}to{opacity:1}}
@keyframes avanca{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes parla{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes apareix{from{opacity:0}to{opacity:1}}
@keyframes creix{from{transform:scale(.4);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.mini,.play-ini,.viu,.progres i,.ona i,.capa,.gran{animation:none}}
@container pagina (max-width: 900px){
  .cont{padding-inline:20px}
  .angel{height:auto;padding-block:56px}
  .angel q{font-size:28px}
  .qui{flex-direction:column;align-items:center;text-align:center}
}
</style>
</helmet>
<div class="pg" style="width: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: hsl(220 14% 11%); background: #fff; -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11' 1">
  <section class="angel">
    <div class="cont centre">
      <p class="retol">Le preguntamos a un gestor qué es Hostly</p>
      <q>No sabría decirte qué es. Solo sé que, desde que lo tengo, me preocupo mucho menos de la gestión de mi apartamento.</q>
      <div class="qui">
        <div class="lloc">
          <button class="mini" type="button" aria-label="Ver el vídeo de Àngel en grande" onClick="{{obre}}">
            <img src="/_blob/c593400eec5b2a33eb4575e382b10889" alt="">
            <span class="play-ini"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg></span>
            <span class="viu">
              <span class="progres"><i></i></span>
              <span class="mut"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5Z"></path><path d="m22 9-6 6"></path><path d="m16 9 6 6"></path></svg></span>
              <span class="ona" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
            </span>
          </button>
        </div>
        <div class="nom"><b>Àngel</b><small>Gestor de pisos turísticos · [pisos y lugar]</small><em>Toca el vídeo para verlo en grande</em></div>
      </div>
    </div>
    <sc-if value="{{obert}}" hint-placeholder-val="{{ false }}">
      <div class="capa" role="dialog" aria-label="Vídeo de Àngel">
        <div class="gran">
          <img src="/_blob/c593400eec5b2a33eb4575e382b10889" alt="">
          <span class="barra"><i></i></span>
          <p class="nom-gran">Àngel<small>Gestor de pisos turísticos</small></p>
        </div>
        <button class="tanca" type="button" aria-label="Cerrar el vídeo" onClick="{{tanca}}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const obert = !!(this.state && this.state.obert);
    return {
      obert,
      obre: () => this.setState({ obert: true }),
      tanca: () => this.setState({ obert: false })
    };
  }
}
</script>
</body>
</html>
