<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Te llamo · nota del Biel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:hsl(210 20% 98%)}
.pg{container-type:inline-size;container-name:pagina}
.pg *{box-sizing:border-box}
.pg p,.pg h2{margin:0;padding:0}
.cont{width:100%;max-width:1440px;margin:0 auto;padding-inline:64px}
.pill{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;border-radius:9999px;border:0;font-family:inherit;font-size:16px;font-weight:500;cursor:pointer}
.pill-pri{background:#2563EB;color:#fff}
.truca{height:400px;display:flex;align-items:center;background:hsl(210 20% 98%)}
.nota{max-width:880px;margin:0 auto;width:100%;border-radius:28px;background:#fff;box-shadow:0 12px 40px rgba(15,23,42,.06),inset 0 0 0 1px hsl(220 13% 91%);padding:40px 44px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:28px;align-items:start}
.foto{width:96px;height:96px;border-radius:9999px;background:hsl(210 20% 92%);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.3;color:hsl(220 9% 46%);padding:10px}
.cos h2{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-0.02em}
.cos p{font-size:18px;line-height:1.55;color:hsl(220 14% 28%);margin-top:8px;max-width:36em}
.camp{display:flex;align-items:center;height:56px;margin-top:22px;padding:0 6px 0 8px;gap:10px;border-radius:9999px;background:hsl(210 20% 97%);box-shadow:inset 0 0 0 1px hsl(220 13% 88%);max-width:480px}
.prefix{height:40px;padding:0 12px;border-radius:9999px;background:#fff;display:inline-flex;align-items:center;font-size:15px;font-weight:600}
.camp input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 17px/1 Inter,ui-sans-serif,system-ui,sans-serif;color:hsl(220 14% 11%)}
.camp .pill{height:44px}
.signa{font-size:14px;color:hsl(220 9% 46%);margin-top:12px}
@container pagina (max-width: 900px){
  .cont{padding-inline:20px}
  .truca{height:auto;padding:48px 0}
  .nota{grid-template-columns:minmax(0,1fr);padding:24px}
}
</style>
</helmet>
<div class="pg" style="width: 100%; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; color: hsl(220 14% 11%); background: hsl(210 20% 98%); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11' 1">
  <section class="truca">
    <div class="cont">
      <div class="nota">
        <div class="foto" aria-label="Foto del Biel">[foto del Biel]</div>
        <div class="cos">
          <h2>Soy Biel, el que hizo Hostly.</h2>
          <p>Si prefieres hablarlo antes de empezar, déjame tu teléfono y te llamo yo. Hablamos de tus pisos, nada más.</p>
          <div class="camp"><span class="prefix">+34</span><input type="tel" inputmode="tel" placeholder="Tu teléfono" aria-label="Tu teléfono" autocomplete="tel"><button class="pill pill-pri" type="button">Llámame</button></div>
          <p class="signa">Biel Alsina · fundador de Hostly</p>
        </div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
