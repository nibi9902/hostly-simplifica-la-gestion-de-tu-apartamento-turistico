<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics 4: NO es carrega aquí. Només amb consentiment, des de
         src/lib/galetes.ts (bàner de galetes, redisseny d'octubre 2026). -->

    <!-- Font preconnect + load — descoberta primerenca, evita @import dins CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,300;1,400;1,500&display=swap" />

    <!-- SEO per defecte. Amb data-rh, el component SEO (react-helmet-async) les substitueix per
         les de cada pàgina en carregar: així no hi ha dues canòniques ni dues descripcions. Les
         xarxes i WhatsApp, que no executen JS, veuen aquestes. -->
    <title>Simplifica la gestión de tu apartamento turístico | Hostly</title>
    <meta data-rh="true" name="description" content="Hostly simplifica todo lo que implica tener un piso turístico. Reservas, check-in, mensajes, limpiezas y registro a la policía en una sola app. El check-in, gratis para siempre." />
    <link data-rh="true" rel="canonical" href="https://hostlylabs.com/es" />
    <meta data-rh="true" name="robots" content="index, follow" />
    <meta name="author" content="Hostly" />

    <!-- hreflang -->
    <link data-rh="true" rel="alternate" hreflang="es-ES" href="https://hostlylabs.com/es" />
    <link data-rh="true" rel="alternate" hreflang="ca-ES" href="https://hostlylabs.com/ca" />
    <link data-rh="true" rel="alternate" hreflang="x-default" href="https://hostlylabs.com/es" />

    <!-- Open Graph -->
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:url" content="https://hostlylabs.com/es" />
    <meta data-rh="true" property="og:title" content="Hostly — Una app para todo tu piso turístico" />
    <meta data-rh="true" property="og:description" content="Reservas, mensajes, limpiezas y registro a la policía en una sola app. El check-in y el registro a la policía, gratis para siempre." />
    <meta data-rh="true" property="og:image" content="https://hostlylabs.com/og-image.png" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:locale" content="es_ES" />
    <meta data-rh="true" property="og:locale:alternate" content="ca_ES" />
    <meta data-rh="true" property="og:site_name" content="Hostly" />

    <!-- Twitter Card -->
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:site" content="@hostlylabs" />
    <meta data-rh="true" name="twitter:title" content="Hostly — Una app para todo tu piso turístico" />
    <meta data-rh="true" name="twitter:description" content="Reservas, mensajes, limpiezas y registro a la policía en una sola app. El check-in, gratis para siempre." />
    <meta data-rh="true" name="twitter:image" content="https://hostlylabs.com/og-image.png" />

    <!-- Els schemas JSON-LD (SoftwareApplication, Organization, FAQPage) s'emeten
         per pàgina via react-helmet-async. Veure src/lib/seo/schemas.ts. -->

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
